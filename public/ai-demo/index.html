<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Demo</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 720px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }
      .log {
        white-space: pre-wrap;
        background: #f6f6f6;
        padding: 8px;
        border-radius: 6px;
        min-height: 80px;
      }
      .messages {
        margin-top: 16px;
        border-top: 1px solid #ddd;
        padding-top: 12px;
      }
      button {
        padding: 10px 16px;
        font-weight: 600;
      }
      .ptt {
        background: #0d6efd;
        color: white;
        border: none;
        border-radius: 6px;
      }
      .small {
        font-size: 12px;
        color: #666;
      }
      input,
      select {
        padding: 8px;
      }
    </style>
    <script>
      let mediaRecorder;
      let chunks = [];
      let sessionId = null;
      let token = "";
      let apiBase = "";
      let isRecording = false;

      async function init() {
        apiBase = document.getElementById("api").value.trim();
        token = document.getElementById("token").value.trim();
        log("⚙️ API va token yangilandi");
      }

      function log(msg) {
        const el = document.getElementById("log");
        el.textContent = msg + "\n" + el.textContent;
      }

      async function createSession() {
        apiBase = document.getElementById("api").value.trim();
        token = document.getElementById("token").value.trim();
        const courseId = document.getElementById("course").value.trim() || null;
        const sessionLanguage = "ar";

        const res = await fetch(`${apiBase}/ai/chat/sessions`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({
            courseId: courseId ? Number(courseId) : null,
            sessionLanguage,
          }),
        });
        if (!res.ok) {
          const txt = await res.text().catch(() => "");
          log(`❌ Sessiya yaratishda xato [${res.status}]: ${txt}`);
          return;
        }
        const json = await res.json();
        if (json?.data?.id) {
          sessionId = json.data.id;
          document.getElementById("session").textContent =
            `Session: ${sessionId}`;
          log("✅ Sessiya yaratildi");
        } else {
          log("❌ Sessiya yaratilmagan (kutilmagan javob)");
        }
      }

      async function startRecording() {
        chunks = [];
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          const mime = MediaRecorder.isTypeSupported("audio/webm")
            ? "audio/webm"
            : "audio/ogg";
          mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
          };
          mediaRecorder.onerror = (e) => {
            log("❌ MediaRecorder xato: " + (e.error?.message || "unknown"));
          };
          mediaRecorder.onstop = onStop;
          // timeslice bilan yozib boramiz (ba'zi brauzerlarda bo'sh blob muammosini oldini oladi)
          mediaRecorder.start(250);
          isRecording = true;
          // Tugma tashqarisida qo'yib yuborish holatlari uchun global listenerlar
          const stopOnce = () => {
            try {
              stopRecording();
            } catch {}
          };
          document.addEventListener("mouseup", stopOnce, { once: true });
          document.addEventListener("touchend", stopOnce, { once: true });
          log("🎙️ Yozish boshlandi...");
        } catch (e) {
          log("❌ Mikrofon ruxsati berilmadi yoki xatolik: " + e.message);
        }
      }

      async function stopRecording() {
        if (!isRecording) return;
        isRecording = false;
        // Tugma qo'yib yuborilganda holatni darhol yangilaymiz
        log("⏳ Jarayonda...");
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          try {
            mediaRecorder.stop();
          } catch {}
        }
      }

      async function onStop() {
        const blob = new Blob(chunks, {
          type: chunks[0]?.type || "audio/webm",
        });
        if (!blob || blob.size === 0) {
          log("❌ Audio yozilmadi (bo'sh blob). Iltimos, yana urinib ko'ring.");
          return;
        }
        const fd = new FormData();
        fd.append("file", blob, "voice.webm");
        fd.append("sessionId", String(sessionId));
        const courseId = document.getElementById("course").value.trim();
        if (courseId) fd.append("courseId", String(courseId));

        const res = await fetch(`${apiBase}/ai/chat/voice`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
          body: fd,
        });
        if (!res.ok) {
          const txt = await res.text().catch(() => "");
          log(`❌ Voice yuborishda xato [${res.status}]: ${txt}`);
          return;
        }
        const json = await res.json();
        if (json?.data) {
          renderMessage(json.data);
          log("✅ Javob olindi");
        } else {
          log("❌ Xato (kutilmagan javob): " + JSON.stringify(json));
        }
      }

      function renderMessage(msg) {
        const wrap = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = "row";
        const text = document.createElement("div");
        text.textContent = `[${new Date(msg.createdAt).toLocaleTimeString()}] ${msg.textUz || msg.text || ""}`;
        div.appendChild(text);
        if (msg.audioUrl) {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = msg.audioUrl;
          div.appendChild(audio);
        }
        wrap.prepend(div);
      }
    </script>
  </head>
  <body>
    <h2>AI Voice Demo (PTT)</h2>
    <div class="row">
      <input
        id="api"
        placeholder="API base (e.g. http://localhost:3000)"
        style="flex: 1"
      />
      <input id="token" placeholder="Bearer token" style="flex: 1" />
      <input
        id="course"
        placeholder="courseId (optional)"
        style="width: 140px"
      />
      <button onclick="init()">Init</button>
    </div>
    <div class="row">
      <button onclick="createSession()">Sessiya yaratish</button>
      <span id="session" class="small"></span>
    </div>
    <div class="row">
      <button
        class="ptt"
        onmousedown="startRecording()"
        onmouseup="stopRecording()"
        ontouchstart="startRecording()"
        ontouchend="stopRecording()"
      >
        Bosib gapiring
      </button>
    </div>

    <div class="messages" id="messages"></div>
    <h4>Log</h4>
    <div class="log" id="log"></div>
  </body>
</html>
